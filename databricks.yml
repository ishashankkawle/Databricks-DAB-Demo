  # Permissions defined at resource level will override permissions defined here on global level.
  - user_name: skawle631@gmail.com
    level: CAN_MANAGE

targets:
  dev:
    mode: development
    default: true
    workspace: https://dbc-e8eacbda-17cf.cloud.databricks.com/